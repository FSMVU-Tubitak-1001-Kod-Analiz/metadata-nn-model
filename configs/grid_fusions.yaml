# Other ways to fuse the code side and the metadata side (see models.py), balanced data, held-out repos.
# 14 runs x 5 folds, frozen CodeBERT. Two metadata views:
#   numbers  the change facts + per-file facts (references: ref/concat_repo_in-patch 0.622, ref/gated_repo_in-patch 0.623)
#   text     CodeBERT(change_short), no numeric facts (references: metatext/concat|gated_repo_in-patch_meta-ctxts_facts-False 0.604 / 0.603)
# Not here: projection + gating (that is `gated`); cross-attention runs through `finetune --coattn` (run_fusions.sh).
#   python -m commitclf -c configs/balanced.yaml grid --grid configs/grid_fusions.yaml
folds: all

runs:
  - block: fusion                     # metadata as numbers, 7
    model: [interact, mlb, mfb, late, gated_aux, gated_clip, misa]
    split: repo
    code: [patch]

  - block: fusion                     # metadata as text, 7
    model: [interact, mlb, mfb, late, gated_aux, gated_clip, misa]
    split: repo
    code: [patch]
    metadata: [change_meta_short]
    facts: false
