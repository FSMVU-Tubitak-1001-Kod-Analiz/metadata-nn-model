# Same as colare1793.yaml (same data, embeddings and run folders), with CoLaRe's training
# recipe in `finetune`. Our model on CoLaRe's copy of the Levin & Yehudai / Ghadhab commit set (1,781 commits,
# Corrective / Adaptive / Perfective -> bug / enhancement / clean). Its own folders throughout
# (data/external, data/processed_colare1793, artifacts/colare1793/...). Steps:
#   python -m commitclf -c configs/colare1793.yaml convert-colare     # -> data/external/colare1793/
#   python -m commitclf -c configs/colare1793.yaml prepare
#   python -m commitclf -c configs/colare1793.yaml embed               # patch, patch_before, patch_after
#   python -m commitclf -c configs/colare1793.yaml embed --only message
#   python -m commitclf -c configs/colare1793.yaml grid --grid configs/grid_colare1793.yaml
# Relative paths are relative to the project root.
seed: 42

data:
  # Written by convert-colare (all files with a text diff; `--files java` keeps only .java files
  # and drops the commits without one; write it to another --out and point these paths there).
  source: data/external/colare1793/dataset.csv
  meta: data/external/colare1793/dataset.csv
  restrict_to_source: false
  processed_dir: data/processed_colare1793
  chunksize: 2000

labels: [bug, enhancement, clean]         # order defines class ids

splits:
  # given: CoLaRe's own 5 stratified random folds (same test commits as their paper);
  #        val = 10% of all commits drawn from the other folds -> 70/10/20 (they train on 80%, no val).
  # repo / org: whole repositories / organisations (GitHub user) held out, 7 parts as in our data.
  schemes: [given, repo, org]
  group_splitter: greedy                  # repo/org: balanced parts; StratifiedGroupKFold (scikit-learn <= 1.7)
                                          # made a part of 8 changes from this set's 106 very unequal repos
  given_parts: data/external/colare1793/parts.csv
  given_val_size: 0.10
  n_folds: 5
  val_size: 0.15
  test_size: 0.15

embeddings:
  dir: artifacts/colare1793/embeddings
  batch_size: 32
  fp16: true
  clean_code: true                        # strips license header / imports on patch_before/after only
  save_every: 20
  models:
    codebert: {name: microsoft/codebert-base, max_length: 512}
    bert: {name: bert-base-uncased, max_length: 128}
  # No content_before in their data: only the diff and its two sides.
  inputs:
    patch: {model: codebert, columns: [patch]}
    patch_before: {model: codebert, columns: [patch_before]}
    patch_after: {model: codebert, columns: [patch_after]}
    message: {model: bert, columns: [commit_message]}   # legitimate input on this set (all prior work uses it)

experiment:
  model: concat
  split: given
  subset: null
  code: [patch]                           # best code input on our balanced data
  embed_pool: mean
  file_pool: attention
  metadata: [change]

train:
  epochs: 100
  patience: 10
  batch_size: 32                          # 128 in our runs; ~1,250 training commits -> ~40 steps per epoch
  lr: 3.0e-5
  weight_decay: 1.0e-4
  lr_patience: 3
  lr_factor: 0.5
  dropout: 0.2
  class_weights: true
  file_hidden: [1024, 512]
  metadata_hidden: [128, 256]
  fusion_dim: 512
  head_hidden: [512, 256]
  device: cuda
  out_dir: artifacts/colare1793/runs

# CoLaRe's training recipe (their commit_classifier code, Java run on this set) for `finetune`:
#   - one CodeBERT, fine-tuned, reads both the message and the code; pooler output
#   - message: 256 tokens
#   - code: removed side + added side of each file. CoLaRe takes per hunk context + removed and
#     context + added, 256 tokens each, 5 files x 2 hunks. We take per file patch_before /
#     patch_after, 512 tokens each (about 2 hunks' worth), up to 5 files
#   - AdamW, no weight decay, no lr schedule, no gradient clipping, unweighted cross-entropy
#   - layer-wise lr: embeddings + layers 0-2: 1e-5, layers 3-6: 2e-5, layers 7-11: 4e-5; head 1e-4;
#     the pooler is not trained
#   - batch 6 (theirs: 3 x 2 gradient accumulation), 10 epochs, no early stopping
# Kept from our protocol: the epoch with the best validation macro-F1 is tested (CoLaRe tests the
# last epoch and has no validation set), fp16 inside the encoder, our classifier head (gated
# fusion, BatchNorm MLPs) and our change facts instead of their 29 line counts.
#   python -m commitclf -c configs/colare1793_recipe.yaml finetune --model gated --split given --folds all \
#          --code-ft --code patch_before patch_after --embed-pool pooler
finetune:
  tag: colare-recipe                      # run folder: finetune/<model>_<split>_code-ft_msg-ft_colare-recipe
  share_encoder: true
  code_model: microsoft/codebert-base
  model: microsoft/codebert-base          # unused when shared
  pool: pooler                            # message pooling
  max_length: 256
  code_max_length: 512
  max_files: 5
  layer_lrs: [1.0e-5, 2.0e-5, 4.0e-5]
  code_lr: 2.0e-5                         # unused with layer_lrs
  encoder_lr: 2.0e-5                      # unused with layer_lrs
  head_lr: 1.0e-4
  encoder_weight_decay: 0.0
  head_weight_decay: 0.0
  lr_schedule: none
  clip_grad: null
  class_weights: false
  batch_size: 6
  micro_batch: 6                          # 6 at once instead of 3 x 2: same gradient, and BatchNorm sees 6
  epochs: 10
  patience: 0                             # no early stopping
  grad_checkpointing: true
  fp16: true

baselines:
  features: both
  knn_max_train: 30000
  skip: {}
  out_dir: artifacts/colare1793/baselines

explain:
  out_dir: artifacts/colare1793/explain
