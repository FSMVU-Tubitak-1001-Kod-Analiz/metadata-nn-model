# Balanced subset of the collector data. Everything this config writes goes to its own folders
# (data/processed_balanced, artifacts/balanced/...), so the full-data results stay untouched.
# Run every command with  -c configs/balanced.yaml
# Relative paths are relative to the project root; absolute paths are used as-is.
seed: 42

data:
  # Output of repo-data-collector/collector_v2 (`python run.py build`).
  # source: the file with code (streamed by `embed`); meta: the same rows without code
  # (read by `prepare`; much faster, and it holds the corrected n_pr_commits).
  # For the balanced subset: source = dataset_balanced.csv and restrict_to_source: true
  # (prepare then reads the source's keys once and keeps only those rows).
  source: /home/eislamoglu/PycharmProjects/repo-data-collector/collector_v2/data/final/dataset_balanced.csv
  meta: /home/eislamoglu/PycharmProjects/repo-data-collector/collector_v2/data/final/dataset_meta.csv
  restrict_to_source: true
  processed_dir: data/processed_balanced           # rows.csv, units.csv, splits/<scheme>.csv
  chunksize: 2000                         # rows read from the source CSV at a time

labels: [bug, enhancement, clean]         # order defines class ids

splits:
  # repo / org: whole repositories / organisations held out; random: changes shuffled;
  # time: newest changes are test (1 fold). All files of a change stay in one part.
  schemes: [repo, org, random]
  n_folds: 5
  val_size: 0.15
  test_size: 0.15

embeddings:
  dir: artifacts/balanced/embeddings
  batch_size: 32
  fp16: true                              # half precision on GPU: ~2x faster, same results for our purpose
  clean_code: true                        # strip license header / imports / package line (not on `patch`)
  save_every: 20                          # chunks between progress saves (embedding resumes from there)
  models:
    codebert: {name: microsoft/codebert-base, max_length: 512}
    bert: {name: bert-base-uncased, max_length: 128}
  # Every input is stored per file row as two poolings: <input>.cls.npy and <input>.mean.npy.
  # "pooler" (what the paper used) is recomputed from cls when loading.
  inputs:
    content_before: {model: codebert, columns: [content_before]}
    patch: {model: codebert, columns: [patch]}                    # full diff, - and + lines
    patch_before: {model: codebert, columns: [patch_before]}      # context + removed lines
    patch_after: {model: codebert, columns: [patch_after]}        # context + added lines
    content_after: {model: codebert, columns: [content_after]}    # the file after the change (embed --only content_after)
    message: {model: bert, columns: [pr_title, commit_message], separator: " | "}   # LEAKS THE LABEL
    # Metadata written as text (python -m commitclf metatext -> metatext.csv; see src/commitclf/metatext.py).
    # `text` alone: the text is the input; `text` + `columns`: one input pair, text first, then the code.
    meta_short: {model: codebert, text: file_short}                        # change line + file line, key=value style
    meta_long: {model: codebert, text: file_long}                          # the same in sentences
    patch_meta_short: {model: codebert, text: file_short, columns: [patch]}
    patch_meta_long: {model: codebert, text: file_long, columns: [patch]}
    change_meta_short: {model: codebert, text: change_short}               # one per change: use as metadata group
    change_meta_long: {model: codebert, text: change_long}
  # Windowed inputs (python -m commitclf embed-windows <name>, see src/commitclf/windows.py): one vector
  # per window of up to max_length tokens, at most max_windows per file. As a code input: `<name>`
  # (attention over the windows inside the model) or `<name>mean` (plain mean, precomputed).
  windows:
    # the diff, cut at hunk boundaries
    patch_win: {model: codebert, column: patch, max_length: 512, max_windows: 8}
    # before / after sides per hunk, same hunk grouping on both sides (window k covers the same hunks)
    patch_before_win: {model: codebert, column: patch, side: before, max_length: 512, max_windows: 8}
    patch_after_win: {model: codebert, column: patch, side: after, max_length: 512, max_windows: 8}
    # whole files (cleaned like `embed`): the first 8 consecutive windows
    content_before_win: {model: codebert, column: content_before, mode: chunks, max_length: 512, max_windows: 8}
    content_after_win: {model: codebert, column: content_after, mode: chunks, max_length: 512, max_windows: 8}

# Default experiment. Every field can be overridden per run (command line or configs/grid.yaml).
experiment:
  model: attention                        # code | metadata | concat | gated | attention
  split: repo                             # one of splits.schemes
  subset: null                            # null | single_commit
  code: [content_before, patch]           # embedding inputs per file
  embed_pool: mean                        # mean | cls | pooler (token pooling inside CodeBERT)
  file_pool: attention                    # mean | max | attention (files -> change)
  metadata: [change]                      # change | repo | message (change-level)
  # Per-file facts (status, churn, test file, path flags) are added to every file's
  # vector whenever the model uses metadata, so attention over files can use them.

train:
  epochs: 100                             # upper bound; early stopping usually ends sooner
  patience: 10                            # epochs without val macro-F1 improvement
  batch_size: 128                         # changes per batch
  lr: 3.0e-5
  weight_decay: 1.0e-4
  lr_patience: 3                          # halve the lr after this many epochs without val macro-F1 improvement
  lr_factor: 0.5
  dropout: 0.2
  class_weights: true                     # loss weighted by inverse class frequency (train part)
  file_hidden: [1024, 512]                # per-file encoder
  metadata_hidden: [128, 256]             # change-level metadata tower
  fusion_dim: 512
  head_hidden: [512, 256]
  device: cuda                            # falls back to cpu if unavailable
  out_dir: artifacts/balanced/runs

baselines:
  features: both                          # code | metadata | both
  knn_max_train: 30000                    # KNN is fit on a random subsample of this size
  skip: {}                                # models to leave out per feature set, e.g. {code: [AdaBoost]}
                                          # (AdaBoost takes ~50 min per fold on the 1,536-dim code features)
  out_dir: artifacts/balanced/baselines

explain:
  out_dir: artifacts/balanced/explain