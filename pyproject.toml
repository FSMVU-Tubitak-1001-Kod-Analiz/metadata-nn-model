[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commitclf"
version = "0.1.0"
description = "Bug / enhancement / clean classification of code changes from code embeddings and change metadata"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "tqdm",
    "matplotlib",
    "scikit-learn",
    "torch",
    "transformers",
    "xgboost",
    "lightgbm",
    "catboost",
    "shap",
]

[project.scripts]
commitclf = "commitclf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
